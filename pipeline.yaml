version: 1

pipeline:
  name: ai-app-factory-checkpoint
  mode: checkpoint

stages:
  - id: bootstrap
    description: >
      初始化项目想法。如果 `input/idea.md` 不存在，将用户提供的想法整理为结构化的文档。
    agent: agents/bootstrap.agent.md
    inputs: []
    outputs:
      - input/idea.md
    exit_criteria:
      - idea.md 存在
      - idea.md 描述了一个连贯的产品想法
      - Agent 已使用 `superpowers:brainstorm` 技能进行深入挖掘（必须在输出中明确说明）

  - id: prd
    description: >
      将产品想法转化为结构化的 MVP 级产品需求文档。
    agent: agents/prd.agent.md
    inputs:
      - input/idea.md
    outputs:
      - artifacts/prd/prd.md
    exit_criteria:
      - PRD 包含目标用户
      - PRD 定义 MVP 范围
      - PRD 列出非目标（Out of Scope）
      - PRD 不包含任何技术实现细节

  - id: ui
    description: >
      基于 PRD 生成 UI 结构定义和可预览的原型。
    agent: agents/ui.agent.md
    inputs:
      - artifacts/prd/prd.md
    outputs:
      - artifacts/ui/ui.schema.yaml
      - artifacts/ui/preview.web/index.html
    exit_criteria:
      - ui.schema.yaml 存在
      - 页面数量不超过 3
      - 预览页面可在浏览器中打开
      - Agent 已使用 `ui-ux-pro-max` 技能生成设计系统（必须在输出或 ui.schema.yaml 中明确说明）

  - id: tech
    description: >
      设计最小可行的技术架构和数据模型。
    agent: agents/tech.agent.md
    inputs:
      - artifacts/prd/prd.md
    outputs:
      - artifacts/tech/tech.md
      - artifacts/backend/prisma/schema.prisma
    exit_criteria:
      - 技术栈明确声明
      - 数据模型与 PRD 一致
      - 未进行过早优化或过度设计

  - id: code
    description: >
      根据 UI 结构和技术设计生成可运行的前后端最小系统。
    agent: agents/code.agent.md
    inputs:
      - artifacts/ui/ui.schema.yaml
      - artifacts/tech/tech.md
      - artifacts/backend/prisma/schema.prisma
    outputs:
      - artifacts/backend/
      - artifacts/client/
    exit_criteria:
      - 后端可启动且无重大错误
      - 客户端可渲染并访问
      - 未引入额外的认证或无关功能

  - id: validation
    description: >
      验证代码质量并主动修复编译错误。执行严格代码审查（安全性、代码质量、架构一致性），
      自动修复 TypeScript 类型错误、路径错误、依赖问题等编译错误。
    agent: agents/validation.agent.md
    inputs:
      - artifacts/backend/
      - artifacts/client/
    outputs:
      - artifacts/validation/report.md
      - artifacts/backend/  # 可能包含修复后的代码
      - artifacts/client/   # 可能包含修复后的代码
    exit_criteria:
      - 验证报告已生成
      - 后端依赖已安装且无错误
      - 前端依赖已安装且无错误
      - TypeScript 编译无错误（已自动修复所有编译错误）
      - Prisma schema 验证通过
      - 安全性审查无严重问题
    on_failure:
      action: pause
      message: "代码验证失败，部分问题无法自动修复。请查看 artifacts/validation/report.md 了解详情"

  - id: preview
    description: >
      启动并测试应用，自动检测并修复运行时错误。实际启动后端服务器和前端客户端，
      验证应用可正常运行，生成运行指南和测试报告。
    agent: agents/preview.agent.md
    inputs:
      - artifacts/backend/
      - artifacts/client/
    outputs:
      - artifacts/preview/README.md       # 运行指南
      - artifacts/preview/test-report.md # 运行测试报告
      - artifacts/backend/               # 可能包含修复后的代码
      - artifacts/client/                # 可能包含修复后的代码
    exit_criteria:
      - 运行指南已生成
      - 测试报告已生成
      - 后端服务成功启动（已自动修复启动问题）
      - 前端服务成功启动（已自动修复启动问题）
      - 核心功能可正常访问
